<!-- El glifo del hub: dos interruptores apilados, como el Control Center de
     macOS. Todo va con `fill` y ningún `stroke`: el recoloreo de iconos
     symbolic de GTK sólo reemplaza el relleno, así que un contorno hecho con
     stroke se quedaría del color original sobre una barra clara. Las pistas
     son anillos (subpath exterior + interior con fill-rule evenodd). -->
